name: Release

# One workflow does everything, because the npm trusted publisher is bound to this file
# and because tags and PRs created with GITHUB_TOKEN do not trigger other workflows.
#
#   1. Every push to main updates a release PR (version, CHANGELOG) from Conventional Commits.
#   2. Merging that PR creates the tag and the GitHub release.
#   3. The publish job then stages the package on npm.
#   4. A maintainer approves the staged version on npmjs.com with 2FA. Only then it is installable.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'timootten/jmap-mcp'
    runs-on: ubuntu-latest
    name: Release PR and tag
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # open and update the release PR
      issues: write # release-please labels its PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Stage on npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read # checkout
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: package.json matches the release
        env:
          EXPECTED: ${{ needs.release-please.outputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$EXPECTED"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run smoke
      - name: Stage on npm (a maintainer approves it with 2FA)
        run: npm stage publish --provenance --access public
